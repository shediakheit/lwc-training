<template>
    <!-- 1. The Entry Button on the Record Page -->
    <lightning-card>
        <div class="slds-p-around_medium">
            <lightning-button 
                label="Show All Contacts" 
                variant="brand" 
                onclick={openModal} 
                class="slds-align_absolute-center">
            </lightning-button>
        </div>
    </lightning-card>

    <!-- Modal Wrapper -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_medium">
            <div class="slds-modal__container">
                
                <!-- Modal Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">
                        {modalTitle}
                    </h2>
                </header>

                <!-- Modal Body -->
                <div class="slds-modal__content slds-p-around_medium">
                    
                    <!-- View A: Contact Datatable -->
                    <template if:false={isCreateMode}>
                        <div class="slds-clearfix slds-m-bottom_small">
                            <div class="slds-float_right">
                                <lightning-button 
                                    label="Add New Contact" 
                                    icon-name="utility:add" 
                                    onclick={switchToCreateMode}>
                                </lightning-button>
                            </div>
                        </div>

                        <div style="height: 300px;">
                            <lightning-datatable
                                key-field="Id"
                                data={contacts}
                                columns={columns}
                                onrowaction={handleRowAction}
                                hide-checkbox-column>
                            </lightning-datatable>
                        </div>
                        
                        <template if:true={isTableEmpty}>
                            <p class="slds-text-align_center slds-m-top_medium">No contacts found.</p>
                        </template>
                    </template>

                    <!-- View B: Create New Contact Form -->
                    <template if:true={isCreateMode}>
                        <lightning-record-edit-form
                            object-api-name="Contact"
                            onsuccess={handleSuccess}
                            onerror={handleError}>
                            
                            <lightning-messages></lightning-messages>
                            
                            <div class="slds-grid slds-gutters">
                                <div class="slds-col">
                                    <lightning-input-field field-name="FirstName"></lightning-input-field>
                                    <lightning-input-field field-name="LastName"></lightning-input-field>
                                </div>
                                <div class="slds-col">
                                    <lightning-input-field field-name="Email"></lightning-input-field>
                                    <lightning-input-field field-name="Phone"></lightning-input-field>
                                </div>
                            </div>
                            
                            <!-- Hidden field to link to current Account automatically -->
                            <lightning-input-field field-name="AccountId" value={recordId} class="slds-hide"></lightning-input-field>

                            <div class="slds-m-top_medium slds-align_absolute-center">
                                <lightning-button 
                                    class="slds-m-right_small" 
                                    label="Cancel" 
                                    onclick={switchToTableMode}>
                                </lightning-button>
                                <lightning-button 
                                    variant="brand" 
                                    type="submit" 
                                    label="Save Contact">
                                </lightning-button>
                            </div>
                        </lightning-record-edit-form>
                    </template>
                </div>

                <!-- Modal Footer (Only for Table View) -->
                <template if:false={isCreateMode}>
                    <footer class="slds-modal__footer">
                        <lightning-button label="Close" onclick={closeModal}></lightning-button>
                    </footer>
                </template>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
