<template>
    <!-- Main Container Card -->
    <lightning-card title={cardTitle} icon-name="standard:contact">
        
        <div class="slds-p-around_medium">
            
            <!-- View A: Contact Cards List -->
            <template if:false={isCreateMode}>
                <div class="slds-grid slds-wrap slds-gutters">
                    <template for:each={contacts} for:item="contact">
                        <div key={contact.Id} class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                            <!-- Inner Card for each Contact -->
                            <lightning-card variant="Narrow">
                                <h3 slot="title" class="slds-text-heading_small">
                                    {contact.FirstName} {contact.LastName}
                                </h3>
                                
                                <div slot="actions">
                                    <lightning-button-icon 
                                        icon-name="utility:delete" 
                                        variant="border-filled" 
                                        alternative-text="Delete" 
                                        title="Delete"
                                        data-id={contact.Id}
                                        onclick={handleDeleteContact}>
                                    </lightning-button-icon>
                                </div>

                                <div class="slds-p-horizontal_small">
                                    <div class="slds-grid slds-gutters">
                                        <div class="slds-col">
                                            <p class="slds-text-title_caps slds-text-color_weak">Email</p>
                                            <p>{contact.Email}</p>
                                        </div>
                                        <div class="slds-col">
                                            <p class="slds-text-title_caps slds-text-color_weak">Phone</p>
                                            <p>{contact.Phone}</p>
                                        </div>
                                    </div>
                                </div>
                            </lightning-card>
                        </div>
                    </template>
                </div>

                <template if:true={isTableEmpty}>
                    <p class="slds-text-align_center slds-text-color_weak">No contacts found.</p>
                </template>
            </template>

            <!-- View B: Create New Contact Form -->

    </lightning-card>
</template>
